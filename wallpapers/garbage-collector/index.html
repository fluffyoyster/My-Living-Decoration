<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Garbage Collector</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; cursor: default; }
  #c   { display: block; width: 100vw; height: 100vh; position: fixed; inset: 0; }
  #ui  { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #f88; font: 14px/1.5 monospace; white-space: pre-wrap; padding: 24px; background: #000; z-index: 99; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="ui"></canvas>
<div id="err"></div>
<script src="../../src/sdk/wallpaper-sdk.js"></script>
<script src="shaders.js"></script>
<script src="main.js"></script>
</body>
</html>
